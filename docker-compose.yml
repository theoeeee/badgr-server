services:
  badgr:
    build:
      context: ./badgr
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql://badgr:badgr@db:3306/badgr
    volumes:
      - ./badgr:/app
    depends_on:
      - db

  microservice_csharp:
    build:
      context: ./microservice_csharp
      dockerfile: Dockerfile
    ports:
      - "5000:5000"

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: badgr
      MYSQL_DATABASE: badgr
      MYSQL_USER: badgr
      MYSQL_PASSWORD: badgr
    volumes:
      - db_data:/var/lib/mysql

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - badgr
      - microservice_csharp

volumes:
  db_data:
